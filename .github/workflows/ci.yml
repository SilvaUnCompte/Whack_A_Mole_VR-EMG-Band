name: Format Scripts

on:
  push:
    branches:
      - main

jobs:
  run-once-after-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to see all commit history

      - name: Count commits in this push
        id: commits
        run: |
          COUNT=$(git rev-list --count ${{ github.event.before }}..${{ github.sha }})
          echo "Commits pushed: $COUNT"
          echo "commits_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Unity Auto Format
        if: steps.commits.outputs.commits_count != '0'
        uses: tyirvine/Unity-Actions-Autoformat@1.0.6
        with:
          path: ./Assets/Scripts/